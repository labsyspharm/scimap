[tool.poetry]

name = "SCIMAP"
version = "2.3.6"
description = "Spatial Single-Cell Analysis Toolkit"

license = "MIT"

authors = ["Ajit Johnson Nirmal <ajitjohnson.n@gmail.com>"]

readme = "README.md"

homepage = "https://pypi.org/project/scimap/"
documentation = "https://scimap.xyz"
repository = "https://github.com/labsyspharm/scimap"

keywords = ["image analysis","multiplex imaging","single cell analysis"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

exclude = ["docs"]

[tool.poetry.dependencies]

python = ">=3.12,<3.15"
pytest = "^9.1.1"
anndata = "^0.13.4"
pandas = "^3.0.6"
scipy = "^1.18.1"
seaborn = "^0.13.2"
tifffile = "^2026.9.20"
numpy = "^2.5.4"
pytest-xvfb = "^3.1.1"
matplotlib = "^3.11.2"
PhenoGraph = "^1.5.7"
scanpy = "^1.12.4"
mkdocs = "^1.6.1"
plotly = "^7.1.0"
dask = {extras = ["array"], version = "^2026.8.0"}
zarr = "^3.4.1"
napari = {version = "^0.9.2", optional = true}
numba = "^0.68.0"
shapely = "^2.2.0"
mkdocs-material = "^9.7.7"
napari-ome-zarr = {version = "^0.11.0", optional = true}
llvmlite = "^0.50.0"
combat = "^0.3.3"
mpl-scatter-density = "^0.8"
pyqt6 = {version = "^6.11.0", optional = true}
scikit-learn = "^1.9.1"

[tool.poetry.extras]
napari = ["pyqt6", "napari-ome-zarr", "napari"]

[tool.poetry.dev-dependencies]

# Formatters
black = "^26.10.1"
isort = "^9.0.2"

# Linters
mypy = "^2.4.0"
pydocstyle = "^6.3.0"
pylint = "^4.1.3"

# Testing
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
pytest-describe = "^3.2.0"
pytest-expecter = "^3.1"
pytest-random = "^0.2"
freezegun = "^1.5.5"


# Documentation
mkdocs = "^1.6.1"
pygments = "^2.21.0"

# Tooling
pyinstaller = "^6.22.3"
sniffer = "^0.4.1"
pync = { version = "^2.0.3", platform = "darwin" }
ipython = "^9.17.1"

[tool.poetry.scripts]

scimap-mcmicro = "scimap.cli._scimap_mcmicro:mcmicro_wrap"
scimap-clustering = "scimap.cli._scimap_mcmicro:clustering"
scimap-merge-h5ad = "scimap.cli._scimap_mcmicro:merge"

[tool.black]

target-version = ["py312", "py313", "py314"]
skip-string-normalization = true

[build-system]

#requires = ["poetry>=0.12"]
#build-backend = "poetry.masonry.api"
requires = ["poetry-core"]
#requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
